<template>
    <lightning-layout lwc:if={listEmployee} horizontal-align="center" multiple-rows="true">
        <template for:each={listEmployee} for:item="employee">
            <lightning-layout-item padding="around-small" size="6" small-device-size="6" medium-device-size="4"
                large-device-size="3" key={employee.Id}>
                <c-project-member-tile
                    onemployeeselect={handleEmployeeSelect}
                    selected-employee-id={selectedEmployeeId}
                    employee={employee}>
                </c-project-member-tile>
            </lightning-layout-item>
        </template>
    </lightning-layout>
</template>
